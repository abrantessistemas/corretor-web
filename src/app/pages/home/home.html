<!-- Conteúdo Principal e Dashboard em Cards -->
<main class="main-content">
    <router-outlet></router-outlet>

    <!-- Grid de Dashboard Responsivo Baseado nos menuItems -->
    <section class="dashboard-section">
        <div class="dashboard-grid">
            @for (item of menuItems(); track item.path) {
                @if(item.path !== '/home') {
            <mat-card class="dashboard-card" [class.disabled]="!item.enable"
                [routerLink]="item.enable ? item.path : null" [matTooltip]="!item.enable ? 'Recurso em breve' : ''"
                matTooltipPosition="above">

                <mat-card-header>
                    <div mat-card-avatar class="card-avatar">
                        <mat-icon>{{ item.icon }}</mat-icon>
                    </div>
                    <mat-card-title>{{ item.label }}</mat-card-title>
                </mat-card-header>

                <mat-card-content>
                    <p>{{ item.description }}</p>
                </mat-card-content>

                <mat-card-actions align="end">
                    <button mat-button color="primary" [disabled]="!item.enable">
                        Acessar
                        <mat-icon class="btn-icon">arrow_forward</mat-icon>
                    </button>
                </mat-card-actions>
            </mat-card>
            }
        }
        </div>
    </section>
</main>
